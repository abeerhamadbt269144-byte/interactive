<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8086 تفاعلي – العنونة وInstruction Set</title>
<style>
:root{
  --bg:#f5f6fb; --card:#fff; --ink:#1d2433; --mut:#667085; --line:#d9dce8;
  --pri:#3b5bdb; --pri-d:#2b45b0; --pink:#e8195f; --ok:#12a150; --okbg:#d3f9d8;
  --warn:#f59f00; --warnbg:#fff3bf; --bad:#e03131; --badbg:#ffe3e3; --wr:#e8590c; --wrbg:#ffe8cc;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.7}
code,.c,input.ins,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
.c{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#eef1ff;color:#24308a;padding:0 .4em;border-radius:6px;font-weight:600}
.layout{display:flex;min-height:100vh}
aside{width:262px;flex:none;background:var(--card);border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 10px}
aside h1{font-size:1.05rem;margin:0 8px 2px;color:var(--pink)}
aside .sub{font-size:.75rem;color:var(--mut);margin:0 8px 12px}
aside .grp{font-size:.72rem;letter-spacing:.04em;color:var(--mut);margin:14px 10px 4px;font-weight:700}
aside button{display:block;width:100%;text-align:right;background:none;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer}
aside button:hover{background:#eef1ff}
aside button.on{background:var(--pri);color:#fff}
main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1240px}
h2{margin:0 0 4px;font-size:1.55rem;color:var(--pink)}
h3{margin:18px 0 6px;font-size:1.1rem}
.lead{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0}
.card.soft{background:#f0f4ff;border-color:#cdd7ff}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:999px;padding:0 .7em;font-size:.82rem;font-weight:700}
.tag.g{background:var(--ok)}.tag.o{background:var(--wr)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.btn{font:inherit;font-size:.95rem;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;background:var(--pri);color:#fff;font-weight:700}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:#e7eaf7;color:var(--ink)}.btn.sec:hover{background:#d8ddf2}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{font:inherit;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.88rem;border:2px solid #c9d2ff;background:#fff;color:#24308a;border-radius:999px;padding:3px 14px;cursor:pointer;font-weight:600}
.chip:hover{background:#eef1ff}
.chip.bad{border-color:#ffb3b3;color:#b02525}.chip.bad:hover{background:var(--badbg)}
.chip.good{border-color:#a5e0b5;color:#0b7a3b}.chip.good:hover{background:var(--okbg)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.ins{direction:ltr;text-align:left;flex:1;min-width:220px;font-size:1.1rem;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input.ins:focus,.reg input:focus,.fld:focus{outline:none;border-color:var(--pri)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin-top:12px}
.panel{background:#fbfbfe;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.panel>.pt{font-size:.78rem;font-weight:800;color:var(--mut);margin-bottom:6px;letter-spacing:.04em;direction:ltr;text-align:left}
.regs{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.reg{border:2px solid var(--line);border-radius:10px;padding:4px 8px;background:#fff;transition:all .2s}
.reg .rn{font-size:.72rem;font-weight:800;color:var(--mut);text-align:center}
.reg .cells{display:flex;gap:3px}
.reg input{width:2.5em;text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:1.1rem;font-weight:700;border:2px solid #e3e6f2;border-radius:6px;padding:2px 0;background:#fff;color:var(--ink)}
.reg.w input{width:4.4em}
.reg .hn{display:flex;gap:3px;font-size:.62rem;color:var(--mut);text-align:center}.reg .hn span{flex:1}
.reg.hl{border-color:var(--warn);background:var(--warnbg);box-shadow:0 0 0 3px rgba(245,159,0,.25)}
.reg input.hl{background:#ffe066;border-color:var(--warn)}
.reg.fl,.reg input.fl,.fb.fl{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:#69db7c;transform:scale(1.07)}100%{transform:scale(1)}}
.mem{display:flex;flex-wrap:wrap;gap:5px;direction:ltr}
.mcell{min-width:56px;text-align:center;border:2px solid var(--line);border-radius:8px;background:#fff;padding:1px 3px}
.mcell .ma{font-size:.62rem;color:var(--mut);font-family:ui-monospace,Consolas,monospace}
.mcell .mv{font-size:1.1rem;font-weight:800;font-family:ui-monospace,Consolas,monospace}
.mcell.empty .mv{color:#b9bfd3}
.mcell.rd{border-color:var(--ok);background:var(--okbg)}.mcell.wr{border-color:var(--wr);background:var(--wrbg)}
.mcell.fl{animation:fl 1.6s ease-out}
.stk{direction:ltr;font-family:ui-monospace,Consolas,monospace}
.srow{display:grid;grid-template-columns:58px 40px 112px auto;gap:6px;align-items:center;font-size:.8rem;margin:2px 0;white-space:nowrap}
.srow .sv{text-align:center;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:800;padding:0 4px}
.srow.tos .sv{border-color:var(--pri);background:#e7ecff}
.srow .sv.rd{border-color:var(--ok);background:var(--okbg)}.srow .sv.wr{border-color:var(--wr);background:var(--wrbg)}
.srow .mk{color:var(--pri);font-weight:800;font-family:Tahoma,sans-serif}
.srow .sa{color:var(--mut)}
.io{direction:ltr;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.io .bx{border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px 12px;text-align:center;min-width:120px}
.io .bx b{display:block;font-size:.8rem;color:var(--mut)}
.io .bx .v{font-size:1.4rem;font-weight:800;font-family:ui-monospace,Consolas,monospace;min-height:2rem;color:var(--pri)}
.io .bx.cpu{background:#eef3ff}.io .bx.pt{background:#f1e9ff}
.io .ar{font-size:2.2rem;color:#c3c8dc;transition:all .3s}
.io .ar.on{color:var(--ok);transform:scale(1.25)}
.trace{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.st{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;animation:in .35s ease-out}
.st .n{flex:none;width:28px;height:28px;border-radius:50%;background:#e7eaf7;color:var(--pri);font-weight:800;display:grid;place-items:center;font-size:.85rem;margin-top:2px}
.st.cur{border-color:var(--pri);box-shadow:0 0 0 3px rgba(59,91,219,.15)}
.st.cur .n{background:var(--pri);color:#fff}
.st .tx{min-width:0}.st .tx .l{margin:2px 0}
.st .tx b{color:#1b2a8f}
.l.f{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.95rem}
.fs{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:ui-monospace,Consolas,monospace}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.err{background:var(--badbg);border:2px solid #ffa8a8;border-radius:12px;padding:10px 14px;margin-top:12px}
.err b.h{color:var(--bad)}
.fix{margin-top:6px;color:#0b6b35}
.done{background:var(--okbg);border:2px solid #8ce99a;border-radius:12px;padding:6px 14px;margin-top:4px;font-weight:700;color:#0b6b35}
.mini{font-size:.82rem;color:var(--mut)}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:right}
table.t th{background:#f0f2fa}
section[dir=ltr] table.t th,section[dir=ltr] table.t td{text-align:left}
.limit{border-radius:12px;border:2px solid #ffb3b3;background:#fff7f7;padding:10px 14px;margin:8px 0}
.limit .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pa-row{display:flex;gap:6px;direction:ltr;align-items:center;margin:8px 0;flex-wrap:wrap}
.pa-row .lb{width:120px;font-weight:800;color:var(--mut);font-size:.85rem;text-align:left}
.dg{width:54px;height:62px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:1.7rem;font-weight:800;font-family:ui-monospace,Consolas,monospace;background:#fff}
.dg.z{background:var(--warnbg);border-color:var(--warn)}
.dg.r{background:var(--okbg);border-color:var(--ok);animation:in .5s}
.dg.e{opacity:.15}
.fld{font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff;direction:ltr;text-align:left;width:140px}
select.fld{width:auto;direction:rtl}
.fld.ok{border-color:var(--ok);background:var(--okbg)}.fld.no{border-color:var(--bad);background:var(--badbg)}
.exq{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 16px;margin:12px 0}
.exq .fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin:10px 0}
.exq label{display:block;font-size:.82rem;color:var(--mut);font-weight:700}
.sol{background:#f4fff6;border:1px solid #b2e8c0;border-radius:10px;padding:8px 14px;margin-top:8px;direction:ltr;text-align:left}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:right;font:inherit;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer}
.opt:hover{background:#eef1ff}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.bar{height:10px;background:#e7eaf7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tab{font:inherit;font-size:.88rem;border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:700}
.tab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hero .card{margin:0}.go{cursor:pointer;transition:transform .15s}.go:hover{transform:translateY(-3px)}

.langbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.bits{display:flex;gap:3px;direction:ltr;flex-wrap:wrap;align-items:center;margin:4px 0}
.bits .lb{width:70px;font-size:.8rem;font-weight:800;color:var(--mut)}
.bits .g{display:flex;gap:2px;margin-left:4px;margin-right:4px}
.bt{width:26px;height:32px;display:grid;place-items:center;border:2px solid var(--line);border-radius:6px;background:#fff;font-family:ui-monospace,Consolas,monospace;font-weight:800;font-size:.95rem}
.bt.o{background:var(--okbg);border-color:var(--ok)}
.bt.cy{background:var(--warnbg);border-color:var(--warn)}
.flr{display:flex;gap:4px;direction:ltr;flex-wrap:wrap}
.fb{width:52px;text-align:center;border:2px solid var(--line);border-radius:10px;background:#fff;padding:2px 0;transition:all .25s}
.fb small{display:block;font-size:.62rem;color:var(--mut);font-weight:700}
.fb b{display:block;font-size:.8rem;font-family:ui-monospace,Consolas,monospace}
.fb i{display:block;font-style:normal;font-size:1.2rem;font-weight:800;font-family:ui-monospace,Consolas,monospace}
.fb.on{background:var(--pri);border-color:var(--pri);color:#fff}.fb.on small{color:#dfe5ff}
.fb.un{opacity:.35;background:#f0f1f6}
.fb.ctl{cursor:pointer}.fb.ctl.on{background:var(--pink);border-color:var(--pink)}
.fe{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px;margin-top:10px}
.fe>div{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 12px}
.fe>div.on{border-color:var(--pri);background:#eef1ff}
.fe b.n{font-family:ui-monospace,Consolas,monospace}
.ipm{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;margin:6px 0}
.ipm .mcell.ci{border-color:var(--ok);background:var(--okbg)}
.ipm .mcell.ipc{box-shadow:0 0 0 3px var(--pri);border-color:var(--pri)}
.ipm .ptr{font-size:.7rem;color:var(--pri);font-weight:800;height:1.1em}
.jt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;direction:ltr;margin-top:8px}
.jt div{border:2px solid var(--line);border-radius:10px;padding:2px 10px;background:#fff;font-family:ui-monospace,Consolas,monospace;font-size:.88rem}
.jt div.y{border-color:var(--ok);background:var(--okbg)}.jt div.n{opacity:.55}
@media(max-width:860px){.layout{flex-direction:column}aside{position:static;width:auto;height:auto;border-left:0;border-bottom:1px solid var(--line)}main{padding:18px 14px 50px}html{font-size:16px}}
/* ===== Splash screen ===== */
#splash{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2b2b2e 0%,#161618 60%,#0b0b0c 100%);animation:splashOut .25s ease-in 750ms forwards;direction:ltr}
#splash .sp-wrap{position:relative;width:min(52vmin,280px);aspect-ratio:1/1;animation:splashIn .3s cubic-bezier(.22,.9,.3,1) both}
#splash .sp-wrap::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);filter:blur(6px)}
#splash img{position:relative;display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.18);box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 8px rgba(255,255,255,.04);user-select:none;-webkit-user-drag:none}
@keyframes splashIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash .sp-wrap{animation:none}}
html.sp-lock,html.sp-lock body{overflow:hidden}
</style>
</head>

<script>
'use strict';
/* =====================  أدوات  ===================== */
const R16=['AX','BX','CX','DX','SI','DI','BP','SP','DS','ES','SS','CS'];
const R8=['AL','AH','BL','BH','CL','CH','DL','DH'];
const SEGS=['DS','ES','SS','CS'];
const hex=(n,w=4)=>((n>>>0).toString(16).toUpperCase()).padStart(w,'0');
const H=(n,w=4)=>hex(n,w)+'H';
const c=t=>`<span class="c">${t}</span>`;
const esc=s=>String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
class Err{constructor(msg,fix){this.msg=msg;this.fix=fix}}

function newState(cfg){
  const regs={};R16.forEach(r=>regs[r]=0);Object.assign(regs,cfg.regs||{});
  const mem=new Map();
  (cfg.memSeed||[]).forEach(([a,...bs])=>bs.forEach((b,i)=>mem.set(a+i,b)));
  return {regs,mem,pattern:cfg.memDefault==='pattern',inValue:(cfg.inValue!=null?cfg.inValue:0),ports:{},outVal:null,fl:Object.assign({CF:false,PF:false,AF:false,ZF:false,SF:false,OF:false},cfg.fl||{})};
}
function getReg(st,n){
  if(R16.includes(n))return st.regs[n];
  const base={A:'AX',B:'BX',C:'CX',D:'DX'}[n[0]];
  return n[1]==='L'?st.regs[base]&255:st.regs[base]>>8;
}
function setReg(st,n,v){
  if(R16.includes(n)){st.regs[n]=v&0xFFFF;return}
  const base={A:'AX',B:'BX',C:'CX',D:'DX'}[n[0]];
  if(n[1]==='L')st.regs[base]=(st.regs[base]&0xFF00)|(v&255);
  else st.regs[base]=(st.regs[base]&0x00FF)|((v&255)<<8);
}
const rdB=(st,a)=>{a&=0xFFFFF;return st.mem.has(a)?st.mem.get(a):(st.pattern?((a*53+17)&255):0)};
const rdMem=(st,a,size)=>{let v=0;for(let i=0;i<size/8;i++)v|=rdB(st,a+i)<<(8*i);return v};
const wrMem=(st,a,v,size)=>{for(let i=0;i<size/8;i++)st.mem.set((a+i)&0xFFFFF,(v>>(8*i))&255)};

/* ===== قراءة المعاملات ===== */
function parseNum(s){
  s=s.trim().toUpperCase();
  if(/^0X[0-9A-F]+$/.test(s))return parseInt(s.slice(2),16);
  if(/^[0-9A-F]+H$/.test(s))return parseInt(s.slice(0,-1),16);
  if(/^[01]+B$/.test(s))return parseInt(s.slice(0,-1),2);
  if(/^\d+$/.test(s))return parseInt(s,10);
  return NaN;
}
function parseOperand(raw){
  let u=raw.trim().toUpperCase().replace(/\s+/g,' ');
  if(!u)throw new Err(L('في معامل ناقص (Operand) بالتعليمة.','يوجد معامل (Operand) ناقص في التعليمة.','An operand is missing from the instruction.'));
  let ptr=null;const pm=u.match(/^(BYTE|WORD) PTR\s*(.*)$/);
  if(pm){ptr=pm[1];u=pm[2]}
  if(R16.includes(u))return {k:'reg',n:u,size:16,seg:SEGS.includes(u),raw:u};
  if(R8.includes(u))return {k:'reg',n:u,size:8,raw:u};
  if(u.startsWith('[')||u.includes('[')){
    u=u.replace(/\]\s*\[/g,'+');
    const m=u.match(/^\[(.*)\]$/);
    if(!m)throw new Err(L('صيغة الذاكرة لازم تكون بين أقواس مربعة مثل [BX+SI+10H].','يجب أن توضع صيغة الذاكرة بين أقواس مربعة مثل [BX+SI+10H].','A memory operand must be inside square brackets, e.g. [BX+SI+10H].'));
    const inner=m[1].replace(/\s+/g,'');
    if(!inner)throw new Err(L('الأقواس [ ] فاضية.','الأقواس [ ] فارغة.','The brackets [ ] are empty.'));
    const terms=inner.split(/(?=[+-])/);
    let base=null,idx=null,disp=0,hasDisp=false,dispRaw='';
    for(let t of terms){
      let sg=1;if(t[0]==='-'){sg=-1;t=t.slice(1)}else if(t[0]==='+')t=t.slice(1);
      if(['BX','BP'].includes(t)){if(sg<0)throw new Err(L('ما نگدر نطرح رجستر.','لا يمكن طرح سجل.','A register cannot be subtracted.'));if(base)throw new Err(L('داخل [ ] مسموح base واحد بس (BX أو BP).','يُسمح داخل [ ] بسجل أساس واحد فقط (BX أو BP).','Only one base register (BX or BP) is allowed inside [ ].'));base=t}
      else if(['SI','DI'].includes(t)){if(sg<0)throw new Err(L('ما نگدر نطرح رجستر.','لا يمكن طرح سجل.','A register cannot be subtracted.'));if(idx)throw new Err(L('داخل [ ] مسموح index واحد بس (SI أو DI).','يُسمح داخل [ ] بسجل فهرس واحد فقط (SI أو DI).','Only one index register (SI or DI) is allowed inside [ ].'));idx=t}
      else if(R16.includes(t)||R8.includes(t))throw new Err(L(`ما نگدر نستخدم ${t} داخل [ ]. المسموح بس: BX, BP, SI, DI.`,`لا يمكن استخدام ${t} داخل [ ]؛ المسموح فقط: BX, BP, SI, DI.`,`${t} cannot be used inside [ ]; only BX, BP, SI and DI are allowed.`));
      else{const v=parseNum(t);if(isNaN(v))throw new Err(L(`ما فهمت "${t}" داخل الأقواس. اكتب الأرقام Hex مع H مثل 20H.`,`تعذّر فهم "${t}" داخل الأقواس. اكتب الأعداد بالنظام Hex مع الحرف H مثل 20H.`,`Cannot understand "${t}" inside the brackets. Write hex numbers with an H suffix, e.g. 20H.`));disp+=sg*v;hasDisp=true;dispRaw=(sg<0?'-':'')+t}
    }
    let mode;
    if(!base&&!idx){if(!hasDisp)throw new Err('الأقواس فاضية.');mode='Direct'}
    else if(base&&idx)mode='Based Indexed';
    else if(!hasDisp)mode='Register Indirect';
    else if(base)mode='Based';
    else mode='Indexed';
    let dispExt=0,signExt=false,bits=0;
    if(hasDisp){
      if(mode==='Direct'){if(disp<0||disp>0xFFFF)throw new Err(L('العنوان المباشر لازم يكون 16-bit (لحد FFFFH).','يجب أن يكون العنوان المباشر بعرض 16 بتاً (حتى FFFFH).','A direct address must be 16-bit (up to FFFFH).'));dispExt=disp;bits=16}
      else if(disp<0){if(disp<-0x8000)throw new Err(L('الـ displacement كبير.','الإزاحة (displacement) كبيرة جداً.','The displacement is too large.'));dispExt=disp&0xFFFF;signExt=true;bits=8}
      else if(disp>0xFFFF)throw new Err(L('الـ displacement لازم يكون 16-bit (لحد FFFFH).','يجب أن تكون الإزاحة بعرض 16 بتاً (حتى FFFFH).','The displacement must be 16-bit (up to FFFFH).'));
      else if(disp<=0xFF){dispExt=disp>=0x80?(0xFF00|disp):disp;signExt=true;bits=8}
      else{dispExt=disp;bits=16}
    }
    return {k:'mem',mode,base,idx,disp,hasDisp,dispRaw,dispExt,signExt,bits,seg:base==='BP'?'SS':'DS',ptr,inner:m[1].trim(),raw:'['+m[1].trim()+']'};
  }
  const v=parseNum(u);
  if(isNaN(v))throw new Err(L(`ما فهمت المعامل "${raw.trim()}". استخدم رجستر، أو رقم مثل 20H، أو ذاكرة مثل [BX].`,`تعذّر فهم المعامل "${raw.trim()}". استخدم سجلاً أو عدداً مثل 20H أو ذاكرة مثل [BX].`,`Cannot understand the operand "${raw.trim()}". Use a register, a number such as 20H, or memory such as [BX].`));
  return {k:'imm',val:v,raw:u};
}
const sz=s=>s===8?'Byte (8-bit)':'Word (16-bit)';
const vx=(v,s)=>H(v,s/4);
const descOp=o=>o.k==='mem'?`[${esc(o.inner)}]`:esc(o.raw);

/* ===== التنفيذ ===== */
function analyze(text,st){
  try{return analyze2(text,st)}
  catch(e){if(e instanceof Err)return {error:e.msg,fix:e.fix};throw e}
}
const SUPPORTED='MOV, XCHG, PUSH, POP, LEA, LDS, LES, IN, OUT, ADD, ADC, SUB, SBB, INC, DEC, CMP, NEG, MUL, IMUL, DIV, IDIV, NOT, AND, OR, XOR, TEST, SHL, SAL, SHR, SAR, RCL, RCR, ROL, ROR, STC, CLC, CMC';
function analyze2(text,st){
  text=text.replace(/;.*$/,'').trim();
  if(!text)throw new Err('اكتب تعليمة أول (مثل MOV AX, 1234H).');
  const m=text.match(/^([A-Za-z]+)\s*(.*)$/);
  if(!m)throw new Err('ما فهمت التعليمة.');
  const mn=m[1].toUpperCase();
  if(ENG!=='d'&&!BI_OK.includes(mn))throw new Err(L('','هذا القسم يدعم MOV وتعليمات الحساب والمنطق والإزاحة فقط.','This section supports MOV and the arithmetic, logic and shift instructions only.'));
  const ops=m[2].trim()?m[2].split(',').map(parseOperand):[];

function portOf(o,st,name){
  if(o.k==='imm'){

function presetSuffix(p){

  return '  ['+parts.join(', ')+']';
}
class Sim{

    this.inp=el.querySelector('input.ins');this.inp.value=this.text;
    this.chips=el.querySelector('.chips');this.panels=el.querySelector('.panels');this.out=el.querySelector('.out');this.btn=el.querySelector('[data-a=next]');
    (cfg.presets||[]).forEach((p,i)=>{const b=document.createElement('button');b.className='chip '+(p.kind||'');b.textContent=p.code+presetSuffix(p);b.title=p.tip||'';b.dataset.i=i;this.chips.appendChild(b)});

    // اذا الرجستر 16-bit مظلل نظلل المربعات الداخلية
    ['AX','BX','CX','DX'].forEach(n=>{if(hl.has(n)){hl.add(n[0]+'H');hl.add(n[0]+'L')}});
    ['AL','AH','BL','BH','CL','CH','DL','DH'].forEach(n=>{if(hl.has(n))hl.add(n)});
    const fl=this.flash;
    let html='';
    (cfg.regGroups||[]).forEach(g=>{html+=`<div class="panel"><div class="pt">${g.title}</div><div class="regs">${g.regs.map(n=>this.regHTML(n,hl,fl)).join('')}</div></div>`});
    if(cfg.panels&&cfg.panels.includes('flags'))html+=this.flagsHTML(fl);
    if(cfg.panels&&cfg.panels.includes('mem'))html+=this.memHTML(fl);
    if(cfg.panels&&cfg.panels.includes('stack'))html+=this.stackHTML(fl);
    if(cfg.panels&&cfg.panels.includes('io'))html+=this.ioHTML();
    this.panels.innerHTML=html;
    this.flash=null;
    this.renderOut();this.setBtn();
  }
  flagsHTML(fl){
    const st=this.st;
    return `<div class="panel"><div class="pt">FLAGS</div><div class="flr">${FLN.map(n=>`<div class="fb ctl ${st.fl[n]?'on':''} ${fl&&fl.fl&&fl.fl.has(n)?'fl':''}" data-f="${n}" title="${this.sl('اضغط للتبديل','اضغط للتبديل','Click to toggle')}"><b>${n}</b><i>${st.fl[n]?1:0}</i></div>`).join('')}</div><div class="mini" style="margin-top:4px">${this.sl('اضغط على أي علم لتبديله قبل التنفيذ.','اضغط على أي علم لتبديله قبل التنفيذ.','Click a flag to toggle it before running.')}</div></div>`;
  }
  memHTML(fl){
    const c0=this.cfg,st=this.st,cm=this.curMem;
    let start;
    const focus=cm?cm.pa:null;
    if(c0.memBase!=null){start=c0.memBase;if(focus!=null&&(focus<start||focus+(cm.size/8)>start+12))start=focus-2}
    else start=focus!=null?focus-2:(st.regs.DS*16);
    start=Math.max(0,start)&0xFFFFF;
    let cells='';
    for(let i=0;i<12;i++){
      const a=(start+i)&0xFFFFF;let cls='';
      if(cm&&a>=cm.pa&&a<cm.pa+cm.size/8)cls=cm.rw==='wr'?' wr':' rd';
      const has=st.mem.has(a)||st.pattern;
      if(!has)cls+=' empty';
      if(fl&&fl.fm.has(a))cls+=' fl';
      cells+=`<div class="mcell${cls}"><div class="ma">${hex(a,5)}</div><div class="mv">${has?hex(rdB(st,a),2):'··'}</div></div>`;
    }
    return `<div class="panel" style="grid-column:1/-1"><div class="pt">MEMORY  (Address ← Content) ${cm?` — <span style="color:${cm.rw==='wr'?'var(--wr)':'var(--ok)'}">${cm.rw==='wr'?'Write':'Read'}</span>`:''}</div><div class="mem">${cells}</div></div>`;
  }
  stackHTML(fl){
    const st=this.st,ss=st.regs.SS,sp=st.regs.SP,cm=this.curMem;
    const top=Math.max(this.sp0,sp);
    let rows='';
    for(let i=0;i<=9;i++){
      const off=(top-i)&0xFFFF,a=(ss*16+off)&0xFFFFF;
      const tos=off===sp;
      let cls='';if(cm&&a>=cm.pa&&a<cm.pa+cm.size/8)cls=cm.rw==='wr'?' wr':' rd';
      if(fl&&fl.fm.has(a))cls+=' fl';
      const has=st.mem.has(a);
      rows+=`<div class="srow${tos?' tos':''}"><span class="sa">${hex(a,5)}</span><span class="sv${cls}">${has?hex(rdB(st,a),2):'··'}</span><span class="sa">${hex(ss)}H:${hex(off)}H</span><span class="mk">${tos?'◀ TOS (SP)':''}</span></div>`;
    }
    return `<div class="panel"><div class="pt">STACK  (ينمو للأسفل ↓)</div><div class="stk">${rows}</div></div>`;
  }
  ioHTML(){
    const io=this.io||{dir:this.cfg.ioDir||'in',stage:-1,port:'--',val:null};
    const IN=io.dir==='in',s=io.stage;
    const a1=IN?(s===2):(s===1),a2=IN?(s===1):(s===2);
    const pv=(IN?(s>=1):(s>=1))?io.val:'';
    const dv=IN?(s>=1?io.val:''):(s>=2?io.val:'');
    const dvIn=IN?`<input data-inv style="width:5em;text-align:center;font:inherit;font-weight:800;border:2px solid var(--line);border-radius:8px;direction:ltr" value="${hex(this.st.inValue,this.st.inValue>0xFF?4:2)}" aria-label="قيمة وحدة الإدخال">`:'';
    return `<div class="panel" style="grid-column:1/-1"><div class="pt">I/O</div><div class="io">
      <div class="bx cpu"><b>CPU</b><div class="v">${s>=2&&IN?io.val:(!IN&&s>=1?io.val:'')}</div></div>
      <div class="ar ${(IN?a1:a1)?'on':''}">${IN?'◀':'▶'}</div>
      <div class="bx pt"><b>${IN?'Input':'Output'} Port No.</b><div class="v" style="font-size:1.1rem">${io.port}</div><div class="v">${pv||''}</div></div>
      <div class="ar ${a2?'on':''}">${IN?'◀':'▶'}</div>
      <div class="bx"><b>${IN?'Input':'Output'} Unit</b><div class="v">${IN?'':dv}</div>${dvIn}${IN?'<div class="mini">اكتب القيمة اللي ترسلها الوحدة</div>':''}</div></div>
      <div class="mini" style="text-align:center;margin-top:6px">${IN?'IN: البيانات تمشي من الوحدة إلى الـ Port ثم إلى الـ CPU':'OUT: البيانات تمشي من الـ CPU إلى الـ Port ثم إلى الوحدة'}</div></div>`;
  }
  renderOut(){
    let h='';
    if(this.err){
      h+=`<div class="err"><b class="h">${this.sl('❌ هذي التعليمة غلط!','❌ التعليمة غير صحيحة','❌ This instruction is not valid')}</b><div>${this.err.error}</div>${this.err.fix?`<div class="fix">✅ ${this.err.fix}</div>`:''}</div>`;
    }
    if(this.trace){
      h+='<div class="trace">';
      for(let i=0;i<this.shown;i++){
        h+=`<div class="st${i===this.shown-1?' cur':''}"><div class="n">${i+1}</div><div class="tx">${this.trace.steps[i].html}</div></div>`;
      }
      if(this.done)h+=`<div class="done">${this.sl('✔ خلصت التعليمة – شوف الرجسترات/الذاكرة اللي تغيرت (لونها أخضر لحظة).','✔ اكتملت التعليمة. لاحظ السجلات والأعلام والذاكرة التي تغيّرت (تظهر باللون الأخضر لحظة).','✔ Instruction complete. Watch the registers, flags and memory that changed (they flash green).')}</div>`;
      h+='</div>';
    }else if(!this.err&&this.cfg.hint){h+=`<div class="mini" style="margin-top:12px">${this.cfg.hint}</div>`}
    if(this.note)h+=`<div class="card soft" style="margin-top:10px">${this.note}</div>`;
    this.out.innerHTML=h;
  }
}

function secPA(el){
  head(el,'حساب الـ Physical Address','الـ 8086 عنده 20 خط عنوان (Address Lines)، فيگدر يوصل لـ 2²⁰ = 1MB ذاكرة. بس أكبر رجستر بيه 16-bit بس! فلازم نحسب العنوان الفعلي من (Segment : Offset).');
  el.insertAdjacentHTML('beforeend',`<div class="card">
    <div class="ctl"><span>Segment:</span><input class="fld" id="pSeg" value="89AB" maxlength="4"><span>Offset:</span><input class="fld" id="pOff" value="F012" maxlength="4"><button class="btn" id="pNext"></button><button class="btn sec" id="pAll">⏩ الكل</button><button class="btn sec" id="pRst">↺</button></div>
    <div class="chips"><button class="chip" data-s="89AB" data-o="F012">89AB : F012</button><button class="chip" data-s="3060" data-o="0500">3060 : 0500</button><button class="chip" data-s="9000" data-o="6037">9000 : 6037</button><button class="chip" data-s="FFFF" data-o="0010">FFFF : 0010 (يلف!)</button></div>
    <div id="pView"></div><div id="pTxt" class="trace"></div></div>
    <div class="card soft" id="pExtra"></div>`);
  let step=0;const $=id=>el.querySelector('#'+id);
  const texts=[
    'الـ Segment Register عبارة عن 16-bit = <b>4 خانات Hex</b>.',
    'ننزاح خانة Hex واحدة <b>لليسار</b> (نفس الضرب بـ 10H أو نضيف 0000 بالـ bits)، أي نضيف <b>0</b> من اليمين فيصير 20-bit.',
    'الـ Offset هو 16-bit، فنكمله لـ 20-bit بإضافة <b>0</b> من اليسار.',
    'نجمع الاثنين بالـ <b>Adder</b>، والنتيجة هي الـ Physical Address (20-bit) اللي يطلع على الـ Address Bus.'
  ];
  function parse(){const s=parseInt($('pSeg').value,16),o=parseInt($('pOff').value,16);return [isNaN(s)?0:s&0xFFFF,isNaN(o)?0:o&0xFFFF]}
  function draw(){
    const [s,o]=parse();const sh=hex(s,4)+'0',of='0'+hex(o,4),pa=(s*16+o)&0xFFFFF,pr=hex(pa,5);
    const row=(lb,ds,fn)=>`<div class="pa-row"><span class="lb">${lb}</span>${ds.split('').map((d,i)=>fn(d,i)).join('')}</div>`;
    let h=row('Segment (16-bit)',sh,(d,i)=>`<div class="dg ${i===4?(step>=1?'z':'e'):''}">${i===4&&step<1?'':d}</div>`);
    h+=row('Offset (16-bit)',of,(d,i)=>`<div class="dg ${i===0?(step>=2?'z':'e'):''}">${i===0&&step<2?'':d}</div>`);
    h+=row('Physical Address',pr,(d)=>`<div class="dg ${step>=3?'r':'e'}">${step>=3?d:''}</div>`);
    $('pView').innerHTML=h;
    $('pTxt').innerHTML=texts.slice(0,step+1).map((t,i)=>`<div class="st ${i===step?'cur':''}"><div class="n">${i+1}</div><div class="tx">${t}</div></div>`).join('')+
      (step>=3?`<div class="done"><span class="fs">PA = ${hex(s,4)}0 + ${hex(o,5)} = ${pr}H</span> ${(s*16+o)>0xFFFFF?' — تجاوز 20-bit، العنوان يلف (wrap-around) لأن عدنا 20 خط بس':''}</div>`:'');
    $('pNext').textContent=step>=3?'▶ من الأول':`⏭ الخطوة التالية (${step+1}/4)`;
    let ex='<b>معلومة:</b> نفس الـ Physical Address ممكن يجي من أكثر من (Segment:Offset)! مثلاً ';
    if(s<0xFFFF&&o>=16){ex+=`${c(hex(s,4)+':'+hex(o,4))} و ${c(hex(s+1,4)+':'+hex(o-16,4))} الاثنين يعطون <b>${pr}H</b>.`}
    else ex+='جرب Segment+1 مع Offset−10H وراح تشوف نفس العنوان. (الـ Segments تتداخل كل 16 بايت = 1 paragraph).';
    $('pExtra').innerHTML=ex;
  }
  $('pNext').onclick=()=>{step=step>=3?0:step+1;draw()};
  $('pAll').onclick=()=>{step=3;draw()};$('pRst').onclick=()=>{step=0;draw()};
  ['pSeg','pOff'].forEach(i=>$(i).addEventListener('input',()=>{step=0;draw()}));
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('pSeg').value=b.dataset.s;$('pOff').value=b.dataset.o;step=0;draw()});
  draw();
}

 {n:'Based',g:2,exp:'<b>BX أو BP</b> يحمل الـ base value + <b>displacement</b> (8-bit signed أو 16-bit). الـ 8-bit ينعمل له Sign Extension. مع BX نستخدم DS، ومع BP نستخدم SS.',f:'EA = (BX | BP) + disp',pre:[['MOV AX, [BX+08H]'],['MOV DH, [BX+700H]'],['MOV AX, [BP+4H]','','مع BP يُستخدم SS بدل DS']]},
 {n:'Indexed',g:2,exp:'<b>SI أو DI</b> يحمل قيمة الـ index + <b>displacement</b>. الـ 8-bit ينعمل له Sign Extension قبل الجمع.',f:'EA = (SI | DI) + disp',pre:[['MOV CX, [SI+0A2H]','','القيمة A2H هي 8-bit سالبة (أكبر من 7FH)، فتنقلب إلى FFA2H بالـ Sign Extension'],['MOV [SI+20H], DX'],['MOV AX, [DI+10H]']]},
 {n:'Based Indexed',g:2,exp:'الـ EA هو مجموع <b>base register (BX/BP)</b> + <b>index register (SI/DI)</b> + <b>displacement</b>.',f:'EA = (BX|BP) + (SI|DI) + disp',pre:[['MOV DX, [BX+SI+0AH]'],['MOV [BP+DI], CX'],['MOV AX, [BX+DI]']]}
];

/* ===== ALU + Flags ===== */
const par=v=>{let n=0;for(let i=0;i<8;i++)n+=(v>>i)&1;return n};
function aluOp(op,a,b,size,cf0){
  const mask=size===8?0xFF:0xFFFF,msb=size===8?0x80:0x8000;
  a&=mask;b&=mask;if(op==='INC'||op==='DEC')b=1;
  let res,CF=false,OF=false,AF=false;
  if(op==='ADD'||op==='INC'){const r=a+b;res=r&mask;CF=r>mask;OF=((a^res)&(b^res)&msb)!==0;AF=((a^b^res)&0x10)!==0}
  else if(['SUB','CMP','DEC'].includes(op)){const r=a-b;res=r&mask;CF=a<b;OF=((a^b)&(a^res)&msb)!==0;AF=((a^b^res)&0x10)!==0}
  else{res=op==='AND'?a&b:op==='OR'?a|b:a^b}
  if(op==='INC'||op==='DEC')CF=!!cf0;
  return {res,a,b,fl:{CF,PF:par(res&255)%2===0,AF,ZF:res===0,SF:(res&msb)!==0,OF}};
}
const FL_BITS=[[15,''],[14,''],[13,''],[12,''],[11,'OF'],[10,'DF'],[9,'IF'],[8,'TF'],[7,'SF'],[6,'ZF'],[5,''],[4,'AF'],[3,''],[2,'PF'],[1,''],[0,'CF']];

   <div class="panel" style="margin-top:10px"><div class="pt">FLAG REGISTER</div><div class="flr" id="fReg"></div></div>
   <div class="fe" id="fExp"></div>
   <h3>🔀 ${T('القفزات الشرطية بعد هذه العملية','Conditional jumps after this operation')}</h3>
   <div class="mini">${T('تفحص القفزة الشرطية (Jcc) الأعلام: إن تحقق الشرط تغيّر قيمة IP (يحدث قفز)، وإلا تابع المعالج بالتعليمة التالية.','A conditional jump (Jcc) tests the flags: if the condition holds it changes IP (the jump is taken); otherwise execution continues with the next instruction.')}</div><div class="jt" id="fJ"></div></div>`);
  const $=i=>el.querySelector('#'+i);
  const ctl={DF:false,IF:true,TF:false};
  let revealed=true;
  const pre=[
   ['ADD','FF','01',8,T(`ناتج ${c('FFH + 01H')} هو ${c('00H')} مع خروج رقم محمول، فيصبح CF و ZF و AF و PF كلها 1.`,`${c('FFH + 01H')} gives ${c('00H')} with a carry out, so CF, ZF, AF and PF all become 1.`)],
   ['ADD','7F','01',8,T(`ناتج ${c('127 + 1')} يظهر كالعدد ${c('-128')} بالإشارة، فيصبح OF و SF مساويين 1.`,`${c('127 + 1')} appears as ${c('-128')} in signed form, so OF and SF become 1.`)],
   ['SUB','05','05',8,T(`ناتج ${c('5 − 5')} هو صفر، فيصبح ZF=1 (العددان متساويان).`,`${c('5 − 5')} is zero, so ZF=1 (the two numbers are equal).`)],
   ['SUB','03','05',8,T(`في ${c('3 − 5')} يحدث استلاف (borrow) فيصبح CF=1، والناتج سالب فيصبح SF=1.`,`${c('3 − 5')} needs a borrow so CF=1, and the result is negative so SF=1.`)],
   ['CMP','0A','03',8,T(`تقارن ${c('CMP')} من دون تخزين الناتج. لاحظ القفزات في الأسفل: JA و JG تتحققان لأن 10 أكبر من 3.`,`${c('CMP')} compares without storing the result. See the jumps below: JA and JG are taken because 10 is greater than 3.`)],
   ['ADD','8000','8000',16,T(`في ${c('8000H + 8000H')} بحجم 16 بتاً يكون الناتج 0000H مع CF و OF و ZF.`,`${c('8000H + 8000H')} in 16 bits gives 0000H with CF, OF and ZF set.`)],
   ['AND','F0','0F',8,T('تصفّر العمليات المنطقية العلمين CF و OF دائماً.','Logic operations always clear CF and OF.')]
  ];
  pre.forEach(p=>{const b=document.createElement('button');b.className='chip';b.textContent=`${p[0]} ${p[1]}H, ${p[2]}H`;b.onclick=()=>{$('fOp').value=p[0];$('fA').value=p[1];$('fB').value=p[2];$('fS').value=p[3];revealed=!$('fPr').checked;draw(p[4])};$('fP').appendChild(b)});
  const grpBits=(v,n)=>{let h='<span class="g">';for(let i=n-1;i>=0;i--){h+=`<span class="bt">${(v>>i)&1}</span>`;if(i%4===0&&i)h+='</span><span class="g">'}return h+'</span>'};
  let lastNote='';

    $('fRv').hidden=!hid;
    let a=parseInt($('fA').value,16),b=parseInt($('fB').value,16);if(isNaN(a))a=0;if(isNaN(b))b=0;
    const mask=size===8?0xFF:0xFFFF;a&=mask;b&=mask;
    const unary=op==='INC'||op==='DEC';$('fB').disabled=unary;
    const r=aluOp(op,a,b,size,false),f=r.fl,w=size/4,sym={ADD:'+',INC:'+',SUB:'−',CMP:'−',DEC:'−',AND:'AND',OR:'OR',XOR:'XOR'}[op];

     <div class="bits"><span class="lb">${T('الناتج','Result')}</span>${grpBits(r.res,size)}<span class="mono">= ${hex(r.res,w)}H ${op==='CMP'?T('(لا يُخزَّن)','(not stored)'):''}</span></div>`;

    $('fReg').innerHTML=FL_BITS.map(([bit,n])=>{

    if(hid){

    }
    const logic=['AND','OR','XOR'].includes(op),ones=par(r.res&255),addlike=op==='ADD'||op==='INC';
    const unch=(op==='INC'||op==='DEC')?T(' تنبيه: لا تغيّر INC و DEC العلم CF، فيبقى كما كان.',' Note: INC and DEC do not change CF; it keeps its old value.'):'';
    const ex=[
     ['CF','Carry Flag',f.CF,logic?T('تصفّر العمليات المنطقية CF دائماً.','Logic operations always clear CF.'):addlike?(f.CF?T('خرج رقم محمول (carry) من أعلى بت، أي أن الناتج لا يتسع في الأعداد غير المؤشَّرة (unsigned).','A carry came out of the top bit, so the result does not fit in unsigned arithmetic.'):T('لم يخرج رقم محمول من أعلى بت.','No carry came out of the top bit.')):(f.CF?T(`حدث استلاف (borrow) لأن A أصغر من B (${a} < ${r.b}) في الأعداد غير المؤشَّرة.`,`A borrow occurred because A is smaller than B (${a} < ${r.b}) in unsigned arithmetic.`):T('لم يحدث استلاف (A ≥ B).','No borrow occurred (A ≥ B).'))+unch],
     ['PF','Parity Flag',f.PF,T(`عدد الواحدات في البتات الثمانية الدنيا من الناتج = ${ones}، وهو عدد ${ones%2===0?'زوجي فيكون PF=1':'فردي فيكون PF=0'}.`,`The low 8 bits of the result contain ${ones} one(s): ${ones%2===0?'an even count, so PF=1':'an odd count, so PF=0'}.`)],
     ['AF','Auxiliary Carry',f.AF,logic?T('غير معرَّف (undefined) في العمليات المنطقية، ويُعرض هنا 0.','Undefined for logic operations; shown here as 0.'):T('رقم محمول أو استلاف بين البت 3 والبت 4 (نصف بايت)، ويُستخدم مع الأعداد العشرية المرمّزة BCD.','A carry or borrow between bit 3 and bit 4 (the half-byte boundary); used for BCD arithmetic.')],
     ['ZF','Zero Flag',f.ZF,f.ZF?T('الناتج يساوي صفراً فيكون ZF=1، وبهذا تعرف CMP أن العددين متساويان.','The result is zero, so ZF=1. This is how CMP detects that two numbers are equal.'):T('الناتج لا يساوي صفراً فيكون ZF=0.','The result is not zero, so ZF=0.')],
     ['SF','Sign Flag',f.SF,T(`البت الأعلى في الناتج = ${f.SF?1:0}، ${f.SF?'فالناتج سالب (بالإشارة)':'فالناتج موجب أو صفر'}.`,`The top bit of the result is ${f.SF?1:0}, so the result is ${f.SF?'negative (signed)':'positive or zero'}.`)],
     ['OF','Overflow Flag',f.OF,logic?T('تصفّر العمليات المنطقية OF دائماً.','Logic operations always clear OF.'):f.OF?T('حدث فيض (overflow) في الأعداد المؤشَّرة: الناتج لا يتسع في الحجم المحدد (مثلاً موجب + موجب أعطى سالباً).','Signed overflow: the result does not fit the chosen size (for example positive + positive gave a negative).'):T('لم يحدث فيض في الأعداد المؤشَّرة.','No signed overflow occurred.')]
    ];
    const ctrlEx=[
     ['DF','Direction Flag',ctl.DF,T('يحدد اتجاه عمليات السلاسل (String): CLD يصفّره (تصاعدي) وSTD يضبطه (تنازلي).','Sets the direction of string operations: CLD clears it (increment) and STD sets it (decrement).')],
     ['IF','Interrupt Flag',ctl.IF,T('يفعّل المقاطعات القابلة للحجب: STI يضبطه وCLI يصفّره.','Enables maskable interrupts: STI sets it and CLI clears it.')],
     ['TF','Trap Flag',ctl.TF,T('يشغّل وضع الخطوة الواحدة (Single-step) لأغراض التنقيح (Debug).','Turns on single-step mode for debugging.')]
    ];
    const card=e=>`<div class="${e[2]?'on':''}"><b class="n">${e[0]} = ${e[2]?1:0}</b> <span class="mini">${e[1]}</span><div>${e[3]}</div></div>`;
    $('fExp').innerHTML=ex.map(card).join('')+ctrlEx.map(card).join('');
    const jt=[['JE / JZ',T('يساوي','equal'),f.ZF],['JNE / JNZ',T('لا يساوي','not equal'),!f.ZF],['JA',T('أكبر (بلا إشارة)','above (unsigned)'),!f.CF&&!f.ZF],['JB / JC',T('أصغر (بلا إشارة)','below (unsigned)'),f.CF],['JG',T('أكبر (بإشارة)','greater (signed)'),!f.ZF&&f.SF===f.OF],['JL',T('أصغر (بإشارة)','less (signed)'),f.SF!==f.OF],['JS',T('سالب','negative'),f.SF],['JO',T('فيض','overflow'),f.OF]];
    $('fJ').innerHTML=jt.map(j=>`<div class="${j[2]?'y':'n'}">${j[2]?'✔':'✗'} ${j[0]}<br><span style="font-family:inherit;font-size:.8rem">${j[1]}</span></div>`).join('');
  }
  ['fOp','fA','fB','fS'].forEach(i=>$(i).addEventListener('input',()=>{revealed=!$('fPr').checked;draw()}));
  $('fPr').addEventListener('change',()=>{revealed=!$('fPr').checked;draw()});
  $('fRv').onclick=()=>{revealed=true;draw()};
  draw(pre[0][4]+' '+T('جرّب الأمثلة أعلاه.','Try the examples above.'));
}

/* ===== Instruction Pointer ===== */
const IPCS=0x2000;
function ipProgs(){return {
 sum:{name:T('١) برنامج جمع','1) Addition program'),code:[
  {t:'MOV AX, 0005H',b:[0xB8,0x05,0x00],ex:S=>{S.AX=5}},
  {t:'MOV BX, 0003H',b:[0xBB,0x03,0x00],ex:S=>{S.BX=3}},
  {t:'ADD AX, BX',b:[0x01,0xD8],ex:S=>{const r=aluOp('ADD',S.AX,S.BX,16);S.AX=r.res;S.fl=r.fl},fl:1},
  {t:'HLT',b:[0xF4],halt:1}]},
 loop:{name:T('٢) حلقة بالتعليمة JNZ','2) Loop with JNZ'),code:[
  {t:'MOV CX, 0003H',b:[0xB9,0x03,0x00],ex:S=>{S.CX=3}},
  {t:'DEC CX',b:[0x49],ex:S=>{const r=aluOp('DEC',S.CX,1,16,S.fl.CF);S.CX=r.res;S.fl=r.fl},fl:1},
  {t:'JNZ 0003H',b:[0x75,0xFD],jcc:s=>!s.fl.ZF,cond:'ZF'},
  {t:'HLT',b:[0xF4],halt:1}]},
 jmp:{name:T('٣) JMP تتخطى تعليمة','3) JMP skips an instruction'),code:[
  {t:'MOV AX, 0001H',b:[0xB8,0x01,0x00],ex:S=>{S.AX=1}},
  {t:'JMP 0008H',b:[0xEB,0x03],jcc:()=>true},
  {t:'MOV AX, 0002H',b:[0xB8,0x02,0x00],ex:S=>{S.AX=2}},
  {t:'HLT',b:[0xF4],halt:1}]}
}}
function secIP(el){
  langBar(el);
  head(el,T('مؤشّر التعليمات (Instruction Pointer – IP)','The Instruction Pointer (IP)'),
    T('IP سجل عرضه 16 بتاً يشير إلى <b>التعليمة التالية</b> التي يجب جلبها من الذاكرة. يشكّل مع السجل CS عنوانها الفيزيائي: <span class="fs">PA = CS × 10H + IP</span>. لا يستطيع المبرمج الكتابة فيه بالتعليمة MOV؛ فهو يتغيّر تلقائياً، أو بتعليمات القفز (JMP, Jcc, CALL, RET).',
      'IP is a 16-bit register that points to the <b>next instruction</b> to be fetched from memory. Together with CS it forms the instruction’s physical address: <span class="fs">PA = CS × 10H + IP</span>. A program cannot write to it with MOV; it changes automatically, or through jump instructions (JMP, Jcc, CALL, RET).'));
  el.insertAdjacentHTML('beforeend',`<div class="card soft"><b>${T('دورة تنفيذ التعليمة (ثلاث مراحل):','The instruction cycle (three phases):')}</b><ol>
   <li>${T('<b>الجلب (Fetch):</b> تحسب وحدة BIU العنوان من CS:IP وتجلب بايتات التعليمة من الذاكرة.','<b>Fetch:</b> the BIU computes the address from CS:IP and reads the instruction bytes from memory.')}</li>
   <li>${T('<b>زيادة IP:</b> تُضاف إلى IP طول التعليمة (1 أو 2 أو 3 بايتات)، أي <span class="fs">IP ← IP + length</span>، فيشير إلى التعليمة التالية.','<b>IP increment:</b> IP ← IP + instruction length (1, 2 or 3 bytes), so it points to the following instruction.')}</li>
   <li>${T('<b>التنفيذ (Execute):</b> تنفّذ وحدة EU التعليمة. وإن كانت قفزة تغيّرت قيمة IP إلى عنوان الهدف.','<b>Execute:</b> the EU executes the instruction. If it is a jump, IP is replaced by the target address.')}</li></ol></div>
   <div class="tabs" id="ipT"></div><div id="ipB"></div>`);
  const tabs=el.querySelector('#ipT'),B=el.querySelector('#ipB');
  const PR=ipProgs();
  let S,prog,log,predict=false,curK='sum';
  const layout=code=>{let a=0;return code.map(i=>{const o={...i,addr:a};a+=i.b.length;return o})};
  function load(k){
    curK=k;prog=layout(PR[k].code);S={AX:0,BX:0,CX:0,ip:0,cur:null,phase:0,halted:false,fl:{CF:false,ZF:false,SF:false},chg:null,msg:''};log=[];
    tabs.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k===k));draw();
  }
  function step(force){
    if(S.halted)return;
    S.chg=null;
    if(S.phase===1&&predict&&!force){
      const g=parseInt((B.querySelector('#ipG')||{}).value,16),exp=(S.ip+S.cur.b.length)&0xFFFF;
      if(g!==exp){S.msg=T('غير صحيح. تذكّر: قيمة IP الجديدة = قيمة IP الحالية + طول التعليمة (بالبايت).','Not correct. Remember: new IP = current IP + instruction length (in bytes).');draw();return}
      S.msg='✔ '+T('توقّعك صحيح!','Correct!');
    }else S.msg='';
    if(S.phase===0){
      const ins=prog.find(i=>i.addr===S.ip);
      if(!ins){log.push(T('❌ يشير IP إلى موضع ليس بداية تعليمة؛ البرنامج معطوب.','❌ IP points into the middle of an instruction; the program is broken.'));S.halted=true;draw();return}
      S.cur=ins;const pa=(IPCS*16+S.ip)&0xFFFFF,bs=ins.b.map(x=>hex(x,2)).join(' ');
      log.push(T(`<b>الجلب (Fetch):</b> <span class="fs">PA = ${H(IPCS)} × 10H + ${H(S.ip)} = ${H(pa,5)}</span><br>تُجلب البايتات ${c(bs)} فتكون التعليمة ${c(ins.t)} وطولها ${ins.b.length} بايت.`,
                 `<b>Fetch:</b> <span class="fs">PA = ${H(IPCS)} × 10H + ${H(S.ip)} = ${H(pa,5)}</span><br>The bytes ${c(bs)} are read: the instruction is ${c(ins.t)}, ${ins.b.length} byte(s) long.`));
      S.phase=1;
    }else if(S.phase===1){
      const old=S.ip;S.ip=(S.ip+S.cur.b.length)&0xFFFF;S.chg='ip';
      log.push(T(`<b>زيادة IP:</b> <span class="fs">IP = ${H(old)} + ${S.cur.b.length} = ${H(S.ip)}</span><br>أصبح IP يشير إلى التعليمة التالية.`,
                 `<b>IP increment:</b> <span class="fs">IP = ${H(old)} + ${S.cur.b.length} = ${H(S.ip)}</span><br>IP now points to the next instruction.`));
      S.phase=2;
    }else{
      const ins=S.cur;let msg=T(`<b>التنفيذ (Execute):</b> ${c(ins.t)}`,`<b>Execute:</b> ${c(ins.t)}`);
      if(ins.halt){S.halted=true;msg+='<br>⏹ '+T('توقّف المعالج (HLT) وانتهى البرنامج.','The CPU halts (HLT). The program is finished.')}
      else if(ins.jcc){
        const taken=ins.jcc(S);
        if(taken){const rel=ins.b[1]>127?ins.b[1]-256:ins.b[1],old=S.ip;S.ip=(S.ip+rel)&0xFFFF;S.chg='ip';
          msg+='<br>'+T(`تحقق الشرط فيحدث <b>قفز</b>: <span class="fs">IP = ${H(old)} + (${rel}) = ${H(S.ip)}</span>`,`The condition holds, so the jump is <b>taken</b>: <span class="fs">IP = ${H(old)} + (${rel}) = ${H(S.ip)}</span>`)}
        else msg+='<br>'+T('لم يتحقق الشرط فلا قفز، ويتابع المعالج بالتعليمة التالية.','The condition is false, so no jump: execution continues with the next instruction.');
        if(ins.cond)msg+=` <span class="mini">(ZF=${S.fl.ZF?1:0})</span>`;
      }else{
        ins.ex(S);
        if(ins.fl)msg+='<br>'+T(`تحدّثت الأعلام: ZF=${S.fl.ZF?1:0} ، CF=${S.fl.CF?1:0} ، SF=${S.fl.SF?1:0}`,`Flags updated: ZF=${S.fl.ZF?1:0}, CF=${S.fl.CF?1:0}, SF=${S.fl.SF?1:0}`);
      }
      log.push(msg);S.phase=0;
    }
    draw();
  }
  function draw(){
    const pa=(IPCS*16+S.ip)&0xFFFFF;
    const bytes=[];prog.forEach(i=>i.b.forEach((x,k)=>bytes.push({a:i.addr+k,x,ins:i})));
    const cells=bytes.map(b=>{
      const ci=S.cur&&S.phase>=1&&b.ins===S.cur;
      return `<div><div class="ptr">${b.a===S.ip?'▼ IP':''}</div><div class="mcell ${ci?'ci':''} ${b.a===S.ip?'ipc':''}"><div class="ma">${hex(b.a,4)}</div><div class="mv">${hex(b.x,2)}</div></div></div>`}).join('');
    const rg=(n,v,cls='')=>`<div class="reg w ${cls}"><div class="rn">${n}</div><div class="cells"><input value="${hex(v,4)}" readonly></div></div>`;
    const lab=[T('▶ الجلب (Fetch)','▶ Fetch'),predict?T('⏭ تحقّق من توقّعي','⏭ Check my guess'):T('⏭ زيادة IP','⏭ Increment IP'),T('⏭ التنفيذ (Execute)','⏭ Execute')][S.phase];
    const guess=predict&&S.phase===1&&!S.halted?`<div class="card soft" style="margin:10px 0"><b>${T('توقّع:','Predict:')}</b> ${T(`ستُجلب التعليمة ${c(S.cur.t)} وطولها ${S.cur.b.length} بايت وقيمة IP الحالية ${c(H(S.ip))}. ما قيمة IP بعد الزيادة؟`,`The instruction ${c(S.cur.t)} is ${S.cur.b.length} byte(s) long and IP is currently ${c(H(S.ip))}. What will IP be after the increment?`)} <input class="fld" id="ipG" placeholder="0000" style="width:100px"></div>`:'';
    B.innerHTML=`<div class="card"><div class="ctl"><button class="btn" id="ipN" ${S.halted?'disabled':''}>${S.halted?T('⏹ انتهى','⏹ Finished'):lab}</button><button class="btn sec" id="ipA" ${S.halted?'disabled':''}>${T('⏩ تعليمة كاملة','⏩ Whole instruction')}</button><button class="btn sec" id="ipR">${T('↺ من البداية','↺ Restart')}</button>
      <label class="mini" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="ipP" ${predict?'checked':''}> ${T('وضع التوقّع (Predict mode)','Predict mode')}</label></div>${guess}${S.msg?`<div class="mini" style="margin:6px 0;font-weight:700">${S.msg}</div>`:''}
     <div class="panels"><div class="panel"><div class="pt">CS : IP</div><div class="regs">${rg('CS',IPCS)}${rg('IP',S.ip,S.chg==='ip'?'fl':'')}</div><div class="mono" dir="ltr" style="margin-top:6px;text-align:left">PA = ${hex(pa,5)}H</div></div>
      <div class="panel"><div class="pt">REGISTERS & FLAGS</div><div class="regs">${rg('AX',S.AX)}${rg('BX',S.BX)}${rg('CX',S.CX)}</div><div class="flr" style="margin-top:6px">${['ZF','CF','SF'].map(n=>`<div class="fb ${S.fl[n]?'on':''}"><b>${n}</b><i>${S.fl[n]?1:0}</i></div>`).join('')}</div></div>
      <div class="panel" style="grid-column:1/-1"><div class="pt">${T('البرنامج في الذاكرة (Offset ← Byte)','PROGRAM IN MEMORY (Offset ← Byte)')} &nbsp; CS=${H(IPCS)}</div><div class="ipm">${cells}</div>
       <table class="t" dir="ltr" style="margin-top:6px"><tr><th>Offset</th><th>Bytes</th><th>Instruction</th></tr>${prog.map(i=>`<tr style="${S.cur===i?'background:#eef1ff':''}"><td>${hex(i.addr,4)}</td><td>${i.b.map(x=>hex(x,2)).join(' ')}</td><td><b>${i.t}</b></td></tr>`).join('')}</table></div></div>
     <div class="trace">${log.map((l,i)=>`<div class="st ${i===log.length-1?'cur':''}"><div class="n">${i+1}</div><div class="tx"><div class="l">${l}</div></div></div>`).join('')}</div></div>`;
    B.querySelector('#ipN').onclick=()=>step();
    B.querySelector('#ipA').onclick=()=>{let n=0;do{step(true)}while(!S.halted&&S.phase!==0&&n++<5)};
    B.querySelector('#ipR').onclick=()=>load(curK);
    B.querySelector('#ipP').onchange=e=>{predict=e.target.checked;draw()};
    const g=B.querySelector('#ipG');if(g)g.addEventListener('keydown',e=>{if(e.key==='Enter')step()});
  }
  Object.keys(PR).forEach(k=>{const b=document.createElement('button');b.className='tab';b.dataset.k=k;b.textContent=PR[k].name;b.onclick=()=>load(k);tabs.appendChild(b)});
  load('sum');
}

/* ===== Lectures 5-7: Arithmetic, Mul/Div, Logic, Shift/Rotate (bilingual) ===== */
function biSim(el,cfg){cfg.bi=true;cfg.hint=cfg.hint||T('اضغط على إحدى التعليمات الجاهزة أعلاه أو اكتب تعليمتك ثم اضغط Enter.','Click one of the ready examples above, or type your own instruction and press Enter.');return simBlock(el,cfg)}
function infoTbl(heads,rows){return `<div class="card"><table class="t"><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===0?`<b class="mono" dir="ltr">${x}</b>`:x}</td>`).join('')}</tr>`).join('')}</table></div>`}
const P=(code,ar,en,extra)=>Object.assign({code,fresh:true,note:ar?`<b>${T('ملاحظة:','Note:')}</b> ${T(ar,en)}`:null},extra||{});
const ARITH_REGS={AX:0x0050,BX:0x0100,CX:0x0003,DX:0x0007,SI:0x0200,DS:0x1000,SP:0x2000};
function secArith(el){
  langBar(el);
  head(el,T('التعليمات الحسابية (Arithmetic Instructions)','Arithmetic Instructions'),
    T('تُجري هذه التعليمات الجمع والطرح والمقارنة وتغيير الإشارة على البايتات والكلمات، وتحدّث أعلام الحالة (Status Flags) بحسب الناتج. اختر تعليمة جاهزة أو اكتب تعليمتك، وتابع الخطوات والأعلام.',
      'These instructions add, subtract, compare and negate bytes and words, and update the status flags from the result. Pick a ready example or type your own, and follow the steps and the flags.'));
  el.insertAdjacentHTML('beforeend',infoTbl([T('التعليمة','Instruction'),T('الوظيفة','Purpose'),T('الأعلام المتأثرة','Flags affected')],[
    ['ADD Des, Src',T('جمع بايت مع بايت أو كلمة مع كلمة','Adds byte to byte or word to word'),'AF, CF, OF, PF, SF, ZF'],
    ['ADC Des, Src',T('جمع المعاملين مع علم الحمل (Carry)','Adds the two operands with carry'),'AF, CF, OF, PF, SF, ZF'],
    ['SUB Des, Src',T('طرح بايت من بايت أو كلمة من كلمة؛ ويعمل CF كعلم استلاف (Borrow)','Subtracts byte from byte or word from word; CF acts as the borrow flag'),'AF, CF, OF, PF, SF, ZF'],
    ['SBB Des, Src',T('طرح المعاملين مع الاستلاف الناتج عن العملية السابقة','Subtracts the two operands with the borrow from the previous result'),'AF, CF, OF, PF, SF, ZF'],
    ['INC Src',T('زيادة البايت أو الكلمة بمقدار واحد (سجل أو ذاكرة)','Increments the byte or word by one (register or memory)'),T('كل أعلام الحالة ما عدا CF','All status flags except CF')],
    ['DEC Src',T('إنقاص البايت أو الكلمة بمقدار واحد (سجل أو ذاكرة)','Decrements the byte or word by one (register or memory)'),T('كل أعلام الحالة ما عدا CF','All status flags except CF')],
    ['CMP Des, Src',T('مقارنة بطرح المصدر من الهدف داخلياً؛ لا تتغيّر قيمة المعاملين بل الأعلام فقط (CF, ZF, SF وغيرها)','Compares by internally subtracting Src from Des; the operands do not change, only the flags (CF, ZF, SF …)'),'AF, CF, OF, PF, SF, ZF'],
    ['NEG Src',T('المتمم الثنائي (2’s complement) أي تغيير إشارة العدد','Two’s complement, i.e. changes the sign of a number'),'AF, CF, OF, PF, SF, ZF']
  ])+`<div class="card soft">${T('<b>قاعدة المعاملات:</b> الهدف (Des) سجل أو ذاكرة، والمصدر (Src) سجل أو ذاكرة أو قيمة فورية (Immediate). لا يجوز أن يكون المعاملان في الذاكرة معاً.','<b>Operand rule:</b> Des is a register or memory; Src is a register, memory or an immediate value. Both operands cannot be in memory at the same time.')}</div>`);
  biSim(el,{regs:ARITH_REGS,memBase:0x10100,memSeed:[[0x10100,0x34,0x12],[0x10200,0x05,0x00],[0x10500,0x10,0x00]],default:'ADD AL, 74H',
    regGroups:[grp(T('سجلات البيانات','Data registers'),['AX','BX','CX','DX']),grp(T('مؤشر ومقطع','Index & segment'),['SI','DS'])],panels:['flags','mem'],
    presets:[

      P('ADC DX, AX','CF=1 مضبوط مسبقاً، فيصبح الناتج 0007H + 0050H + 1 = 0058H.','CF=1 is preset, so the result is 0007H + 0050H + 1 = 0058H.',{set:{CF:1}}),
      P('SUB BH, 74H','BH=01H أصغر من 74H فيحدث استلاف: CF=1 والناتج 8DH.','BH=01H is smaller than 74H so a borrow occurs: CF=1 and the result is 8DH.'),
      P('SUB CX, BX','CX=0003H و BX=0100H: الناتج FF03H مع CF=1 (استلاف) و SF=1.','CX=0003H and BX=0100H: the result is FF03H with CF=1 (borrow) and SF=1.'),
      P('SUB AX, [500H]','العنوان المباشر 500H: الكلمة 0010H فيصبح AX=0040H.','Direct address 500H holds 0010H, so AX becomes 0040H.'),
      P('SBB CX, BX','CF=1 مضبوط مسبقاً فيُطرح BX و CF معاً: 0003H − 0100H − 1.','CF=1 is preset so both BX and CF are subtracted: 0003H − 0100H − 1.',{set:{CF:1}}),
      P('INC AX','تزيد AX بمقدار 1؛ لاحظ أن CF لا يتغيّر.','Increments AX by 1; notice that CF does not change.'),
      P('INC WORD PTR [SI]','الزيادة في الذاكرة: الكلمة عند DS:SI تصبح 0006H. نحتاج WORD PTR لتحديد الحجم.','Incrementing memory: the word at DS:SI becomes 0006H. WORD PTR is needed to give the size.'),
      P('DEC AX','تنقص AX بمقدار 1.','Decrements AX by 1.'),
      P('DEC WORD PTR [BX]','تنقص الكلمة عند DS:BX من 1234H إلى 1233H.','The word at DS:BX goes from 1234H to 1233H.'),
      P('CMP AX, 50H','المقارنة بين قيمتين متساويتين: يصبح ZF=1، ولا تتغيّر AX.','Comparing two equal values: ZF=1, and AX is unchanged.'),
      P('CMP AL, 80H','AL=50H أصغر من 80H (بلا إشارة) فيصبح CF=1 دون تغيير AL.','AL=50H is smaller than 80H (unsigned) so CF=1, with AL unchanged.'),
      P('NEG AX','AX=0050H تصبح FFB0H (−80). المتمم الثنائي = المتمم الأحادي + 1.','AX=0050H becomes FFB0H (−80). Two’s complement = one’s complement + 1.'),
      P('ADD [BX], [SI]',null,null,{kind:'bad'}),P('ADD AL, BX',null,null,{kind:'bad'})
    ]});
}
const MD_REGS={AX:0x0014,BX:0x0005,CX:0,DX:0,SI:0,DS:0x1000,SP:0x2000};
function secMulDiv(el){
  langBar(el);
  head(el,T('الضرب والقسمة (MUL, IMUL, DIV, IDIV)','Multiplication and Division (MUL, IMUL, DIV, IDIV)'),
    T('تفترض هذه التعليمات أن أحد المعاملين موجود ضمناً في AL أو AX، ولذلك تحتاج إلى معامل واحد فقط (Src). الحرف I في IMUL و IDIV يدل على العمليات المؤشَّرة (Signed).',
      'These instructions assume that one operand is implicitly in AL or AX, so they need only one operand (Src). The letter I in IMUL and IDIV stands for signed operations.'));
  el.insertAdjacentHTML('beforeend',infoTbl([T('التعليمة','Instruction'),T('الوصف','Description'),T('النتيجة','Result')],[
    ['MUL Src',T('ضرب بلا إشارة (Unsigned): بايتان ينتجان كلمة، وكلمتان تنتجان كلمة مزدوجة','Unsigned multiplication: two bytes give a word, two words give a double word'),'AX = AL × Src<br>DX:AX = AX × Src'],
    ['IMUL Src',T('ضرب بإشارة (Signed)','Signed multiplication'),'AX = AL × Src<br>DX:AX = AX × Src'],
    ['DIV Src',T('قسمة بلا إشارة: كلمة ÷ بايت، أو كلمة مزدوجة ÷ كلمة؛ المقسوم في AX (أو DX:AX) والمقسوم عليه Src','Unsigned division: word ÷ byte, or double word ÷ word; the dividend is in AX (or DX:AX) and the divisor is Src'),T('الخارج في <span class="fs">AL</span> والباقي في <span class="fs">AH</span> (كلمة ÷ بايت)<br>الخارج في <span class="fs">AX</span> والباقي في <span class="fs">DX</span> (كلمة مزدوجة ÷ كلمة)','Quotient in <span class="fs">AL</span>, remainder in <span class="fs">AH</span> (word ÷ byte)<br>Quotient in <span class="fs">AX</span>, remainder in <span class="fs">DX</span> (double word ÷ word)')],
    ['IDIV Src',T('قسمة بإشارة (Signed) بالصيغة نفسها','Signed division in the same form'),T('الخارج في <span class="fs">AL</span> والباقي في <span class="fs">AH</span> (كلمة ÷ بايت)<br>الخارج في <span class="fs">AX</span> والباقي في <span class="fs">DX</span> (كلمة مزدوجة ÷ كلمة)','Quotient in <span class="fs">AL</span>, remainder in <span class="fs">AH</span> (word ÷ byte)<br>Quotient in <span class="fs">AX</span>, remainder in <span class="fs">DX</span> (double word ÷ word)')]
  ])+`<div class="card soft">${T('<b>انتبه:</b> المعامل لا يكون قيمة فورية، ويحدّد حجمُه نوع العملية (بايت أو كلمة). عند القسمة على صفر أو إذا لم يتسع الخارج في السجل يحدث خطأ قسمة (Divide Error).','<b>Note:</b> the operand cannot be an immediate, and its size selects the operation (byte or word). Dividing by zero, or a quotient that does not fit in the register, causes a Divide Error.')}</div>`);
  biSim(el,{regs:MD_REGS,default:'MUL BL',
    regGroups:[grp(T('سجلات البيانات','Data registers'),['AX','BX','CX','DX'])],panels:['flags'],
    presets:[
      P('MUL BL','AL=14H (20) و BL=05H فيكون AX = 0064H (100)؛ وبما أن AH=0 يبقى CF=OF=0.','AL=14H (20) and BL=05H give AX = 0064H (100); AH=0 so CF=OF=0.'),
      P('MUL BL','AL=FFH (255) و BL=FFH: الناتج FE01H، ويحتاج AH فيصبح CF=OF=1.','AL=FFH (255) and BL=FFH: the result FE01H needs AH, so CF=OF=1.',{set:{AX:0x00FF,BX:0x00FF}}),
      P('IMUL BL','AL=FFH تساوي −1 بالإشارة، و BL=02H فيكون الناتج −2 = FFFEH. الناتج يتسع في AL بالإشارة فيبقى CF=OF=0.','AL=FFH is −1 signed and BL=02H so the result is −2 = FFFEH. It fits in AL as a signed value, so CF=OF=0.',{set:{AX:0x00FF,BX:0x0002}}),
      P('MUL BX','AX=1000H و BX=0010H: الناتج 00010000H فيصبح DX:AX = 0001:0000 و CF=OF=1.','AX=1000H and BX=0010H: the result is 00010000H, so DX:AX = 0001:0000 and CF=OF=1.',{set:{AX:0x1000,BX:0x0010}}),
      P('DIV BL','AX=0064H (100) ÷ 07H: الخارج 0EH (14) في AL والباقي 02H في AH.','AX=0064H (100) ÷ 07H: the quotient 0EH (14) goes to AL and the remainder 02H to AH.',{set:{AX:0x0064,BX:0x0007}}),
      P('DIV BX','DX:AX = 0001:0000 (65536) ÷ 0010H: الخارج 1000H في AX والباقي 0 في DX.','DX:AX = 0001:0000 (65536) ÷ 0010H: the quotient 1000H goes to AX and the remainder 0 to DX.',{set:{AX:0x0000,DX:0x0001,BX:0x0010}}),
      P('IDIV BL','AX=FF9CH (−100) ÷ 07H: الخارج −14 = F2H والباقي −2 = FEH (يأخذ إشارة المقسوم).','AX=FF9CH (−100) ÷ 07H: the quotient −14 = F2H and the remainder −2 = FEH (it takes the sign of the dividend).',{set:{AX:0xFF9C,BX:0x0007}}),
      P('DIV BL','القسمة على صفر تسبّب Divide Error.','Division by zero causes a Divide Error.',{set:{AX:0x0064,BX:0x0000},kind:'bad'}),
      P('DIV BL','AX=1000H ÷ 02H: الخارج 800H لا يتسع في AL (بايت واحد) فيحدث Divide Error.','AX=1000H ÷ 02H: the quotient 800H does not fit in AL (one byte), so a Divide Error occurs.',{set:{AX:0x1000,BX:0x0002},kind:'bad'})
    ]});
}
const LG_REGS={AX:0x000F,BX:0x0079,CX:0,DX:0,DS:0x1000,SP:0x2000};
function secLogic(el){
  langBar(el);
  head(el,T('التعليمات المنطقية (Logical Instructions)','Logical Instructions'),
    T('تُجري هذه التعليمات عمليات منطقية بت ببت على المعاملين. تتتبع الخطوات هنا الأعداد الثنائية لترى كل بت وكيف يتغيّر.','These instructions perform bit-by-bit logic on their operands. The steps below show the binary numbers so you can see every bit change.'));
  el.insertAdjacentHTML('beforeend',infoTbl([T('التعليمة','Instruction'),T('الوصف','Description'),T('الأعلام','Flags')],[
    ['NOT Src',T('المتمم الأحادي (1’s complement): تُقلب كل بتات المعامل (سجل أو ذاكرة)','One’s complement: every bit of the operand (register or memory) is inverted'),T('لا تتأثر أي أعلام','No flags affected')],
    ['AND Des, Src',T('عملية AND بين الهدف والمصدر؛ الناتج يُخزَّن في الهدف','AND of Des and Src; the result is stored in Des'),T('يصبح <span class="fs">CF=OF=0</span> وتُحدَّث <span class="fs">PF, SF, ZF</span>','<span class="fs">CF=OF=0</span>; <span class="fs">PF, SF, ZF</span> are updated')],
    ['OR Des, Src',T('عملية OR بين الهدف والمصدر','OR of Des and Src'),T('يصبح <span class="fs">CF=OF=0</span> وتُحدَّث <span class="fs">PF, SF, ZF</span>','<span class="fs">CF=OF=0</span>; <span class="fs">PF, SF, ZF</span> are updated')],
    ['XOR Des, Src',T('عملية XOR بين الهدف والمصدر','XOR of Des and Src'),T('يصبح <span class="fs">CF=OF=0</span> وتُحدَّث <span class="fs">PF, SF, ZF</span>','<span class="fs">CF=OF=0</span>; <span class="fs">PF, SF, ZF</span> are updated')],
    ['TEST Des, Src',T('عملية AND دون تغيير الهدف (Non-destructive)؛ تتغيّر الأعلام فقط','AND without modifying Des (non-destructive); only the flags change'),T('يصبح <span class="fs">CF=OF=0</span> وتُحدَّث <span class="fs">PF, SF, ZF</span>','<span class="fs">CF=OF=0</span>; <span class="fs">PF, SF, ZF</span> are updated')]
  ])+`<div class="card soft">${T('<b>قاعدة المعاملات:</b> المصدر قد يكون قيمة فورية أو سجلاً أو ذاكرة، والهدف سجل أو ذاكرة، ولا يجوز أن يكون الاثنان في الذاكرة معاً.','<b>Operand rule:</b> Src may be an immediate, register or memory; Des is a register or memory; both cannot be memory at the same time.')}</div>`);
  biSim(el,{regs:LG_REGS,default:'AND AL, BL',
    regGroups:[grp(T('سجلات البيانات','Data registers'),['AX','BX','CX','DX'])],panels:['flags'],
    presets:[
      P('NOT AL','AL=20H = 0010 0000 فتصبح 1101 1111 = DFH.','AL=20H = 0010 0000 becomes 1101 1111 = DFH.',{set:{AX:0x0020}}),
      P('AND AL, BL','0000 1111 AND 0111 1001 = 0000 1001 = 09H. تُستعمل AND عادةً لتصفير بتات (Masking).','0000 1111 AND 0111 1001 = 0000 1001 = 09H. AND is commonly used to clear bits (masking).'),
      P('OR AL, BL','0000 1111 OR 0111 1001 = 0111 1111 = 7FH. تُستعمل OR لضبط بتات.','0000 1111 OR 0111 1001 = 0111 1111 = 7FH. OR is commonly used to set bits.'),
      P('XOR AL, BL','0000 1111 XOR 0111 1001 = 0111 0110 = 76H. تقلب XOR البتات المختلفة.','0000 1111 XOR 0111 1001 = 0111 0110 = 76H. XOR yields 1 where the bits differ.'),
      P('TEST AL, 01H','يفحص البت الأول: AL=35H فردي فيبقى ZF=0، دون تغيير AL.','Tests bit 0: AL=35H is odd so ZF=0, and AL is unchanged.',{set:{AX:0x0035}}),
      P('AND AL, 0FH','تصفّر النصف الأعلى: A7H تصبح 07H.','Clears the upper nibble: A7H becomes 07H.',{set:{AX:0x00A7}}),
      P('XOR AX, AX','طريقة سريعة لتصفير السجل: يصبح AX=0000H و ZF=1.','A quick way to clear a register: AX becomes 0000H and ZF=1.',{set:{AX:0x1234}}),
      P('OR AL, AL','لفحص الصفر: AL=00H فيصبح ZF=1.','A zero test: AL=00H so ZF=1.',{set:{AX:0x0000}})
    ]});
}
const SH_REGS={AX:0x0033,BX:0x0100,CX:0x0003,DX:0,DS:0x1000,SP:0x2000};
function secShift(el){
  langBar(el);
  head(el,T('الإزاحة والتدوير (Shift and Rotate)','Shift and Rotate Instructions'),
    T('تحرّك هذه التعليمات بتات المعامل (سجل أو ذاكرة) لليمين أو لليسار. صيغتها <span class="fs">OP D, Count</span>، والعدّاد إمّا 1 أو السجل CL عندما يزيد العدد على 1. يظهر في كل خطوة مربّع CF أمام البتات.',
      'These instructions move the bits of the operand (register or memory) left or right. The form is <span class="fs">OP D, Count</span>, where Count is 1, or the CL register when the count is greater than 1. Each step shows the CF box next to the bits.'));
  el.insertAdjacentHTML('beforeend',infoTbl([T('التعليمة','Instruction'),T('الوصف','Description'),T('المخطط','Diagram')],[
    ['SHL / SAL D, Count',T('إزاحة منطقية/حسابية لليسار: يدخل 0 من اليمين','Shift logic/arithmetic left: a 0 enters from the right'),'<span class="fs">CF ← [ b7 … b0 ] ← 0</span>'],
    ['SHR D, Count',T('إزاحة منطقية لليمين: يدخل 0 من اليسار','Shift logic right: a 0 enters from the left'),'<span class="fs">0 → [ b7 … b0 ] → CF</span>'],
    ['SAR D, Count',T('إزاحة حسابية لليمين: يبقى بت الإشارة','Shift arithmetic right: the sign bit is preserved'),'<span class="fs">b7 → [ b7 … b0 ] → CF</span>'],
    ['RCL D, Count',T('تدوير لليسار عبر علم الحمل','Rotate left through carry'),'<span class="fs">CF ← [ b7 … b0 ] ← CF</span>'],
    ['ROL D, Count',T('تدوير لليسار','Rotate left'),'<span class="fs">CF ← [ b7 … b0 ] ← b7</span>'],
    ['ROR D, Count',T('تدوير لليمين','Rotate right'),'<span class="fs">b0 → [ b7 … b0 ] → CF, b0 → b7</span>'],
    ['RCR D, Count',T('تدوير لليمين عبر علم الحمل','Rotate right through carry'),'<span class="fs">CF → [ b7 … b0 ] → CF</span>']
  ])+`<div class="card soft">${T('<b>فائدة:</b> الإزاحة لليسار بمقدار n تضرب القيمة في 2<sup>n</sup>، والإزاحة لليمين تقسمها على 2<sup>n</sup> (SHR بلا إشارة، و SAR بإشارة). استخدم الأمر <span class="c">STC</span> لضبط CF قبل تجربة RCL و RCR.','<b>Tip:</b> shifting left by n multiplies by 2<sup>n</sup>, and shifting right divides by 2<sup>n</sup> (SHR unsigned, SAR signed). Use <span class="c">STC</span> to set CF before trying RCL and RCR.')}</div>`);
  el.insertAdjacentHTML('beforeend',`<div class="card soft"><b>${T('لماذا تتطابق نتائج بعض التعليمات في أمثلة الشرائح؟','Why do some instructions give the same result in the slide examples?')}</b><ul>
    <li>${T('<b>SHL مع ROL:</b> يختلفان فقط في البت الداخل من اليمين (0 في SHL، والبت الخارج في ROL). إذا كان البت الخارج 0 (مثل 33H) تتطابق النتيجتان.','<b>SHL vs ROL:</b> they differ only in the bit that enters from the right (0 for SHL, the bit that left for ROL). If the outgoing bit is 0 (as in 33H) the results match.')}</li>
    <li>${T('<b>SHR مع ROR:</b> البت الداخل من اليسار هو 0 في SHR، والبت الخارج في ROR. إذا كان البت الخارج 0 تتطابقان.','<b>SHR vs ROR:</b> the bit entering from the left is 0 for SHR and the outgoing bit for ROR. If the outgoing bit is 0 they match.')}</li>
    <li>${T('<b>SAR مع SHR:</b> تتطابقان إذا كان بت الإشارة 0. و<b>RCL/RCR</b> تعطيان نتيجة SHL/ROL (أو SHR/ROR) بحسب قيمة CF عند إزاحة واحدة، وتختلف عنهما عند إزاحتين أو أكثر.','<b>SAR vs SHR:</b> they match if the sign bit is 0. <b>RCL/RCR</b> match SHL/ROL (or SHR/ROR) depending on CF for a single shift, and differ from both for two or more shifts.')}</li></ul>
    ${T('استعمل مختبر المقارنة التالي بقيم تُظهر الفرق (مثل B3H أو 85H مع عدّاد 2).','Use the comparison lab below with values that expose the differences (such as B3H or 85H with a count of 2).')}</div>
    <div class="card"><h3>${T('مختبر المقارنة: التعليمات الثماني معاً','Comparison lab: all eight instructions together')}</h3>
    <div class="ctl"><span>${T('القيمة (Hex):','Value (hex):')}</span><input class="fld" id="cV" value="B3" style="width:100px"><select class="fld" id="cS"><option value="8">8-bit</option><option value="16">16-bit</option></select><span>${T('عدد الإزاحات:','Count:')}</span><input class="fld" id="cN" value="2" style="width:70px"><label class="mini" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cC"> CF = 1</label></div>
    <div class="chips" id="cP"></div><div id="cT" style="margin-top:8px"></div></div>`);
  (function lab(){
    const $=i=>el.querySelector('#'+i);
    [['B3','8','2',0],['B3','8','1',0],['85','8','2',0],['85','8','1',1],['33','8','1',1],['84','8','1',1]].forEach(a=>{const b=document.createElement('button');b.className='chip';b.textContent=`${a[0]}H, count ${a[2]}, CF=${a[3]}`;b.onclick=()=>{$('cV').value=a[0];$('cS').value=a[1];$('cN').value=a[2];$('cC').checked=!!a[3];draw()};$('cP').appendChild(b)});
    function draw(){
      const n=+$('cS').value,mask=n===8?0xFF:0xFFFF;let v=parseInt($('cV').value,16);if(isNaN(v))v=0;v&=mask;
      let cnt=parseInt($('cN').value,10);if(isNaN(cnt)||cnt<0)cnt=0;if(cnt>16)cnt=16;const cf0=$('cC').checked;
      const rows=['SHL','SAL','SHR','SAR','ROL','ROR','RCL','RCR'].map(m=>{let x=v,cf=cf0;for(let i=0;i<cnt;i++){const r=shiftOnce(m,x,cf,n);x=r.v;cf=r.cf}return {m,x,cf}});
      const key=r=>r.x+'_'+r.cf;
      $('cT').innerHTML=`<div class="bits"><span class="lb">${T('الأصل','Start')}</span><span class="bt cy">${cf0?1:0}</span>${bg(v,n)}<span class="mono">= ${H(v,n/4)}</span></div><table class="t" style="margin-top:6px"><tr><th>${T('التعليمة','Instruction')}</th><th>CF</th><th>${T('البتات','Bits')}</th><th>Hex</th><th>${T('تتطابق مع','Same as')}</th></tr>${rows.map(r=>{const same=rows.filter(o=>o!==r&&key(o)===key(r)).map(o=>o.m);return `<tr style="${same.length?'background:#fff8e1':''}"><td><b class="mono" dir="ltr">${r.m} ${cnt}</b></td><td class="mono">${r.cf?1:0}</td><td>${brow('',r.x,n)}</td><td class="mono">${H(r.x,n/4)}</td><td class="mono" dir="ltr">${same.join(', ')||'—'}</td></tr>`}).join('')}</table>`;
    }
    ['cV','cS','cN','cC'].forEach(i=>$(i).addEventListener('input',draw));draw();
  })();
  biSim(el,{regs:SH_REGS,memBase:0x10100,default:'SHL AL, 1',
    regGroups:[grp(T('سجلات البيانات','Data registers'),['AX','BX','CX','DX'])],panels:['flags'],
    presets:[
      P('SHL AL, 1','AL=33H = 0011 0011 تصبح 0110 0110 = 66H (ضعف القيمة) و CF=0.','AL=33H = 0011 0011 becomes 0110 0110 = 66H (doubled) and CF=0.'),
      P('SAL AL, 1','SAL مطابقة لـ SHL تماماً في كل الحالات.','SAL is identical to SHL in every case.'),
      P('SHR AL, 1','AL=84H = 1000 0100 تصبح 0100 0010 = 42H و CF=0 (يدخل 0 من اليسار).','AL=84H = 1000 0100 becomes 0100 0010 = 42H and CF=0 (a 0 enters from the left).',{set:{AX:0x0084}}),
      P('SAR AL, 1','AL=84H تصبح 1100 0010 = C2H لأن بت الإشارة (1) يُحفَظ.','AL=84H becomes 1100 0010 = C2H because the sign bit (1) is preserved.',{set:{AX:0x0084}}),
      P('RCL AL, 1','CF=1 والقيمة 33H: يدخل CF من اليمين فتصبح 0110 0111 = 67H و CF=0.','CF=1 and the value 33H: CF enters from the right giving 0110 0111 = 67H, and CF=0.',{set:{AX:0x0033,CF:1}}),
      P('ROL AL, 1','أعلى بت (0) يدخل من اليمين فتصبح 66H و CF=0. النتيجة مثل SHL هنا لأن البت الخارج صفر؛ جرّب ROL مع B3H في الأمثلة بالأسفل. ولا يدخل CF في الحلقة.','The top bit (0) re-enters from the right giving 66H and CF=0. The result equals SHL here only because the outgoing bit is 0; try ROL with B3H below. CF is not part of the ring.',{set:{AX:0x0033,CF:1}}),
      P('ROR AL, 1','AL=84H: البت الأدنى (0) يدخل من اليسار فتصبح 42H و CF=0.','AL=84H: the lowest bit (0) re-enters from the left giving 42H and CF=0.',{set:{AX:0x0084}}),
      P('RCR AL, 1','CF=1 و AL=84H: يدخل CF من اليسار فتصبح 1100 0010 = C2H و CF=0.','CF=1 and AL=84H: CF enters from the left giving 1100 0010 = C2H and CF=0.',{set:{AX:0x0084,CF:1}}),
      P('SHL AL, CL','CL=2 و AL=B3H: إزاحتان لليسار: B3H = 1011 0011 تصبح CCH = 1100 1100 (ضاع البتان 1 و0 من اليسار وتدخل 00 من اليمين).','CL=2 and AL=B3H: two left shifts: B3H = 1011 0011 becomes CCH = 1100 1100 (the bits 1 and 0 are lost on the left, and 00 enters on the right).',{set:{AX:0x00B3,CX:2}}),
      P('ROL AL, CL','نفس القيمة B3H مع تدويرتين: لا يضيع شيء، فتصبح CEH = 1100 1110 (البتان الخارجان 1 و0 دخلا من اليمين).','The same value B3H with two rotations: nothing is lost, giving CEH = 1100 1110 (the two bits that left, 1 and 0, re-entered on the right).',{set:{AX:0x00B3,CX:2}}),
      P('RCL AL, CL','نفس القيمة مع CF=0: الحلقة تضم CF فتصبح CDH = 1100 1101.','The same value with CF=0: the ring includes CF, giving CDH = 1100 1101.',{set:{AX:0x00B3,CX:2}}),
      P('SHR AL, CL','CL=2 و AL=85H: إزاحتان لليمين: 1000 0101 تصبح 0010 0001 = 21H (يدخل 00 من اليسار).','CL=2 and AL=85H: two right shifts: 1000 0101 becomes 0010 0001 = 21H (00 enters from the left).',{set:{AX:0x0085,CX:2}}),
      P('SAR AL, CL','نفس القيمة 85H: يبقى بت الإشارة 1 فتصبح 1110 0001 = E1H.','The same value 85H: the sign bit 1 is preserved, giving 1110 0001 = E1H.',{set:{AX:0x0085,CX:2}}),
      P('ROR AL, CL','تدويرتان لليمين: البتان الخارجان (1 ثم 0) يدخلان من اليسار فتصبح 0110 0001 = 61H.','Two right rotations: the two bits that left (1 then 0) re-enter from the left, giving 0110 0001 = 61H.',{set:{AX:0x0085,CX:2}}),
      P('RCR AL, CL','نفس القيمة مع CF=0: الحلقة تضم CF فتصبح 1010 0001 = A1H.','The same value with CF=0: the ring includes CF, giving 1010 0001 = A1H.',{set:{AX:0x0085,CX:2}}),
      P('SHR AX, CL','CL=3: قسمة AX=0100H على 8 فيصبح 0020H.','CL=3: dividing AX=0100H by 8 gives 0020H.',{set:{AX:0x0100,CX:3}}),
      P('STC','ضبط CF=1 (ويقابلها CLC للتصفير و CMC للعكس).','Sets CF=1 (CLC clears it and CMC complements it).',{fresh:false}),
      P('SHL AL, 3',null,null,{kind:'bad'})
    ]});
}

function secQuiz(el){
  head(el,'اختبار سريع','17 سؤالاً من المحاضرات. اضغط على الجواب وشوف الشرح.');
  el.insertAdjacentHTML('beforeend','<div class="card" id="qz"></div>');
  const box=el.querySelector('#qz');let i=0,score=0;
  function draw(){
    if(i>=QUIZ.length){box.innerHTML=`<h3>النتيجة: ${score} من ${QUIZ.length}</h3><p>${score>=9?'🌟 ممتاز!':score>=6?'👍 زين، راجع الأسئلة اللي غلطت بيها.':'📚 راجع الأقسام وجرب مرة ثانية.'}</p><button class="btn" id="qr">أعد الاختبار</button>`;box.querySelector('#qr').onclick=()=>{i=0;score=0;draw()};return}
    const q=QUIZ[i];
    box.innerHTML=`<div class="bar"><i style="width:${i/QUIZ.length*100}%"></i></div><p class="mini">سؤال ${i+1} من ${QUIZ.length}</p><b>${q.q}</b><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div><div id="qe"></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});
      if(k===q.a)score++;else b.classList.add('no');
      box.querySelector('#qe').innerHTML=`<div class="card soft">${k===q.a?'✔ صح! ':'✗ غلط. '}${q.e}</div><button class="btn" id="qn">${i+1<QUIZ.length?'السؤال التالي':'اعرض النتيجة'}</button>`;
      box.querySelector('#qn').onclick=()=>{i++;draw()};
    });
  }
  draw();
}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='<h1>8086 تفاعلي</h1><div class="sub">Addressing Modes + Instruction Set</div>';
  SECTIONS.forEach(s=>{
    const en=LANG==='en';
    const g=en&&s.gEn?s.gEn:s.g;
    if(g)nav.insertAdjacentHTML('beforeend',`<div class="grp">${g}</div>`);
    const b=document.createElement('button');b.dataset.id=s.id;b.textContent=`${s.icon}  ${en&&s.en?s.en:s.title}`;b.onclick=()=>show(s.id);if(s.id===curId)b.classList.add('on');nav.appendChild(b);
  });
}
function show(id){
  const main=document.getElementById('main');
  main.querySelectorAll('section.sec').forEach(s=>s.hidden=true);
  if(!built[id]){const s=document.createElement('section');s.className='sec';
    if(LANG==='en'&&BI.has(id)){s.dir='ltr';s.lang='en'}
    main.appendChild(s);built[id]=s;SECTIONS.find(x=>x.id===id).fn(s)}
  built[id].hidden=false;curId=id;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  try{history.replaceState(null,'','#'+id)}catch(e){}
  window.scrollTo(0,0);
}
function setLang(l){
  LANG=l;
  [...BI].forEach(i=>{if(built[i]){built[i].remove();delete built[i]}});
  renderNav();show(curId);
}
(function init(){
  var bt=document.getElementById('boot');if(bt)bt.remove();
  renderNav();
  const h=location.hash.slice(1);
  show(SECTIONS.some(s=>s.id===h)?h:'home');
})();
